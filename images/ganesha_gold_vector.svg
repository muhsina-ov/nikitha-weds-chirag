<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#F2D06B" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#99751D" />
    </linearGradient>
    
    <!-- Radial Gold Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2D06B" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Background Halo -->
  <circle cx="100" cy="100" r="90" fill="url(#auraGlow)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7" />
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="1" />

  <!-- Outer Decorative Petals Mandala -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.85">
    <!-- 12 Petals around the circle -->
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(0 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(30 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(60 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(90 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(120 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(150 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(180 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(210 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(240 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(270 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(300 100 100)" />
    <path d="M 100,20 C 105,10 115,10 120,20 C 115,25 105,25 100,20 Z" transform="rotate(330 100 100)" />
  </g>

  <!-- Sacred Ganesha Line Art Motif -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <!-- Mukut / Crown -->
    <path d="M 100 38 L 105 48 L 112 52 L 100 45 L 88 52 L 95 48 Z" />
    <path d="M 100 32 L 102 38 L 98 38 Z" />
    <circle cx="100" cy="30" r="2.5" />
    <path d="M 92 53 Q 100 50 108 53 L 106 58 Q 100 56 94 58 Z" />
    
    <!-- Tilak / Trishul Mark -->
    <path d="M 99 59 C 99 57 101 57 101 59 L 101 64 C 101 65 99 65 99 64 Z" />
    <path d="M 97 60 Q 100 63 103 60" fill="none" stroke="url(#goldGrad)" stroke-width="1" />

    <!-- Head & Big Ears (Suparakarn) -->
    <!-- Left Ear -->
    <path d="M 92 56 C 75 56 68 70 78 80 C 85 85 91 80 93 72 Z" opacity="0.9" />
    <!-- Right Ear -->
    <path d="M 108 56 C 125 56 132 70 122 80 C 115 85 109 80 107 72 Z" opacity="0.9" />

    <!-- Tusk Details -->
    <!-- Right Tusk (Ekadanta - Intact) -->
    <path d="M 106 81 Q 109 85 110 89 L 107 88 Q 105 84 104 81 Z" />
    <!-- Left Tusk (Broken) -->
    <path d="M 94 81 L 91 84 L 93 85 L 96 81 Z" />

    <!-- Trunk (Vakratunda) curving right with Modak -->
    <path d="M 93 72 Q 100 68 107 72 Q 105 82 101 90 Q 97 98 98 104 Q 100 110 108 109 Q 115 107 114 101 Q 112 96 106 97 Q 103 98 104 101 Q 106 104 110 102 Q 110 106 105 105 Q 98 103 96 95 Q 96 88 101 80 Q 103 74 97 74 Z" />

    <!-- Modak in Trunk / Hand -->
    <path d="M 108 97 C 106 93 112 91 113 95 C 114 98 110 100 108 97 Z" />

    <!-- Eyes & Brows -->
    <ellipse cx="94" cy="67" rx="2" ry="1" />
    <ellipse cx="106" cy="67" rx="2" ry="1" />

    <!-- Lotus Base Sitting Throne -->
    <path d="M 100 125 C 80 120 70 135 65 142 C 80 142 95 136 100 128 C 105 136 120 142 135 142 C 130 135 120 120 100 125 Z" opacity="0.9" />
    <path d="M 100 128 C 88 126 78 135 76 148 C 90 147 97 140 100 132 C 103 140 110 147 124 148 C 122 135 112 126 100 128 Z" opacity="0.8" />
  </g>

  <!-- Small Bottom Om / Swastik Ornament Points -->
  <circle cx="100" cy="165" r="3" fill="url(#goldGrad)" />
  <circle cx="90" cy="165" r="1.5" fill="url(#goldGrad)" opacity="0.7" />
  <circle cx="110" cy="165" r="1.5" fill="url(#goldGrad)" opacity="0.7" />
</svg>